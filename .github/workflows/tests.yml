name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TADK test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: bash bin/tadk test unit

      - name: Run smoke tests
        run: bash bin/tadk test smoke

      - name: Run integration tests
        run: bash bin/tadk test integration
